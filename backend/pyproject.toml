[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "axiomflo-agent"
version = "0.1.0"
description = "AxiomFlo Agent: Gemini-powered cost assistant built on Google's Agent Development Kit (Milestone 1: local, read-only, sample data)."
requires-python = ">=3.11"
dependencies = [
  # Google Agent Development Kit. Pinned so behaviour only changes when we choose to upgrade.
  "google-adk==2.12.0",
  # Timezone database for Australia/Sydney on systems without one (Windows).
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["axiomflo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning"]
